<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .road{
                fill:none;
                stroke:#2C3E50;
                stroke-width:3;
                stroke-linecap:round;
                stroke-linejoin:round;
            }

            .lane{
                fill:none;
                stroke:#F1C40F;
                stroke-width:2;
                stroke-dasharray:4 4;
            }

            .vehicle{
                fill:#2980B9;
            }

            .flow{
                fill:none;
                stroke:#27AE60;
                stroke-width:2.5;
                stroke-linecap:round;
                stroke-linejoin:round;
            }
        </style>
    </defs>

    <!-- Road -->
    <rect
        x="18"
        y="8"
        width="28"
        height="48"
        rx="4"
        class="road"/>

    <!-- Center Lane -->
    <line
        class="lane"
        x1="32"
        y1="10"
        x2="32"
        y2="54"/>

    <!-- Vehicles -->
    <rect
        class="vehicle"
        x="22"
        y="14"
        width="6"
        height="8"
        rx="1.5"/>

    <rect
        class="vehicle"
        x="36"
        y="28"
        width="6"
        height="8"
        rx="1.5"/>

    <rect
        class="vehicle"
        x="22"
        y="42"
        width="6"
        height="8"
        rx="1.5"/>

    <!-- Flow Arrow -->
    <path
        class="flow"
        d="M52 46
           C58 38 58 26 52 18"/>

    <path
        class="flow"
        d="M50 20
           L52 18
           L54 20"/>

</svg>