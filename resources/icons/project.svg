<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .outline{
                fill:none;
                stroke:#2C3E50;
                stroke-width:3;
                stroke-linecap:round;
                stroke-linejoin:round;
            }

            .road{
                fill:none;
                stroke:#2980B9;
                stroke-width:2.8;
                stroke-linecap:round;
                stroke-linejoin:round;
            }

            .grid{
                fill:#27AE60;
            }
        </style>
    </defs>

    <!-- Folder -->
    <path
        class="outline"
        d="M8 18
           H24
           L28 24
           H56
           V50
           H8
           Z"/>

    <!-- Alignment -->
    <path
        class="road"
        d="M16 42
           C24 34 30 28 38 28
           C44 28 48 34 52 22"/>

    <!-- Digital Twin Nodes -->
    <circle class="grid" cx="18" cy="42" r="2"/>
    <circle class="grid" cx="30" cy="31" r="2"/>
    <circle class="grid" cx="40" cy="28" r="2"/>
    <circle class="grid" cx="52" cy="22" r="2"/>

</svg>