<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .outline{
                fill:none;
                stroke:#2C3E50;
                stroke-width:3.5;
                stroke-linecap:round;
                stroke-linejoin:round;
            }

            .center{
                fill:none;
                stroke:#F1C40F;
                stroke-width:2;
                stroke-dasharray:4 4;
                stroke-linecap:round;
            }
        </style>
    </defs>

    <!-- Road Surface -->
    <path
        class="outline"
        d="M10 40
           L22 24
           H42
           L54 40
           Z"/>

    <!-- Pavement Layers -->
    <line class="outline" x1="18" y1="32" x2="46" y2="32"/>

    <line class="outline" x1="14" y1="36" x2="50" y2="36"/>

    <!-- Center Line -->
    <line class="center" x1="32" y1="24" x2="32" y2="40"/>

</svg>